[workspace]
resolver = "3"
members = ["aff4-blockreader", "contract-tests", "e01-blockreader", "vmdk-blockreader"]

[workspace.package]
edition = "2024"
authors = ["Jeffrey Bolas"]
license = "MIT"
repository = "https://github.com/jbolas/blockreader-adapters"

# blockreader and aff4tools come from crates.io, never by path: a project that
# names e01-blockreader or vmdk-blockreader as a git dependency gets this
# repository alone, so a path outside it would not resolve. To build against
# local checkouts instead, add a [patch.crates-io] entry outside this file, for
# example in an uncommitted .cargo/config.toml.
[workspace.dependencies]
blockreader = "0.1"
# A reader never needs hash-asm, and without it no C compiler is needed for sha2.
aff4tools = { version = "0.1", default-features = false }
# imagereader-rs is pinned once here. Switching to a fork changes these two lines.
e01-rs = { git = "https://github.com/strozfriedberg/imagereader-rs", rev = "4dec71dc4621979e0751fc9a0ee27af765524fd6", default-features = false }
vmdk-rs = { git = "https://github.com/strozfriedberg/imagereader-rs", rev = "4dec71dc4621979e0751fc9a0ee27af765524fd6" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
